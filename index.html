<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wahda Prototype · Events</title>
<style>
  :root{
    color-scheme:only light;
    --brand:#0E7C66; --brand-dark:#0A5D4E; --brand-soft:#E3F2EE;
    --ink:#1C1B18; --ink-2:#6B6A66; --ink-3:#9B9993;
    --bg:#F4F2EE; --card:#FFFFFF; --line:#E5E2DC;
    --danger:#D64545; --gold:#C9A24B; --gold-soft:#FBF5E6;
    --r-lg:16px; --r-md:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Helvetica Neue",sans-serif;
    background:#ECEAE4;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}

  .page-head{width:100%;max-width:430px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .page-head h1{font-size:15px;font-weight:600;color:#3A3934;white-space:nowrap}
  .head-actions{display:flex;align-items:center;gap:8px}
  .lang-toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;
    font-weight:600;color:var(--brand);cursor:pointer;font-family:inherit;min-width:64px}

  /* ═══ phone ═══ */
  .phone{width:390px;max-width:100%;height:800px;background:var(--bg);border-radius:44px;border:10px solid #161513;
    box-shadow:0 24px 60px rgba(0,0,0,.18);position:relative;overflow:hidden;display:flex;flex-direction:column;
    transform:translateZ(0);isolation:isolate}
  .statusbar{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;
    font-size:12px;font-weight:600;color:var(--ink);position:relative;z-index:50}
  .statusbar .sb-r{letter-spacing:.5px}
  .screen-wrap{flex:1;position:relative;overflow:hidden}
  .page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
  .page.active{display:flex;animation:slidein .26s ease;z-index:10}
  @keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  .page.back-anim{animation:slideback .26s ease}
  @keyframes slideback{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
  .scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:22px}
  /* 带 tabbar + FAB 的页面，底部留出足够空间，避免最后一张卡被压住 */
  #pg-home .scroll,#pg-my .scroll{padding-bottom:100px}
  .scroll::-webkit-scrollbar{display:none}

  /* ═══ nav ═══ */
  .navbar{flex:none;display:flex;align-items:center;gap:8px;padding:2px 12px 8px;min-height:46px}
  .nav-title{font-size:17px;font-weight:700;flex:1;padding-left:8px}
  .back-btn{width:40px;height:40px;border:none;background:none;border-radius:20px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;color:var(--ink);font-family:inherit;font-size:22px}
  .icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:50%;display:flex;
    align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);font-size:15px;font-family:inherit}

  /* ═══ generic ═══ */
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 10px}
  .sec-h h3{font-size:15px;font-weight:700;letter-spacing:-.1px}
  .sec-h .more{font-size:12px;color:var(--ink-3);font-weight:500}
  .rail{display:flex;gap:11px;overflow-x:auto;padding:0 20px 6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line)}

  /* ═══ search ═══ */
  .search{margin:0 20px 12px;height:40px;background:#fff;border:1px solid var(--line);border-radius:12px;
    display:flex;align-items:center;gap:8px;padding:0 13px;color:var(--ink-3);font-size:13px}
  .search input{flex:1;border:none;outline:none;background:none;font-family:inherit;font-size:13px;color:var(--ink)}
  .search input::placeholder{color:var(--ink-3)}

  /* ═══ location bar ═══ */
  .locbar{margin:0 20px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;
    display:flex;align-items:center;gap:10px;cursor:pointer}
  .locbar .lb-ic{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .locbar .lb-main{flex:1;min-width:0}
  .locbar .lb-t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
  .locbar .lb-s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .locbar .lb-act{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);
    border-radius:999px;padding:5px 11px;flex:none}

  /* ═══ seg ═══ */
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 20px 14px}
  .seg button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-3);
    padding:7px 0;border-radius:999px;cursor:pointer;white-space:nowrap;flex:1}
  .seg button.on{background:var(--brand);color:#fff}

  /* ═══ banner (featured rail) —— 真实封面图 ═══ */
  .bn{flex:0 0 272px;height:172px;border-radius:18px;padding:14px 15px;color:#fff;position:relative;
    overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;
    background:#1C1B18;box-shadow:0 6px 18px rgba(28,27,24,.16)}
  .bn-img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .bn-scr{position:absolute;left:0;top:0;right:0;bottom:0;z-index:1;
    background:linear-gradient(180deg,rgba(12,12,10,.04) 0%,rgba(12,12,10,.26) 40%,rgba(12,12,10,.90) 100%)}
  .bn-em{display:none}
  .bn-tag{position:absolute;top:13px;left:14px;font-size:10px;font-weight:800;letter-spacing:.6px;
    background:rgba(255,255,255,.95);color:#141310;border-radius:6px;padding:4px 9px;z-index:2;
    text-transform:uppercase;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .bn-t{font-size:16.5px;font-weight:800;line-height:1.24;position:relative;z-index:2;padding-right:8px;
    text-shadow:0 1px 8px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bn-s{font-size:11px;opacity:.93;margin-top:5px;position:relative;z-index:2;line-height:1.4;padding-right:8px}
  .bn-org{opacity:.86;font-size:10.5px;max-width:170px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .bn-f{position:absolute;bottom:13px;right:14px;font-size:11.5px;font-weight:800;z-index:2;
    background:rgba(255,255,255,.96);color:#141310;border-radius:999px;padding:4px 10px;
    box-shadow:0 2px 8px rgba(0,0,0,.20)}

  /* ═══ category rail —— 圆形封面 ═══ */
  .cat{flex:0 0 auto;width:60px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .cico{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:21px;color:#fff;flex:none;border:2px solid #fff;position:relative;overflow:hidden;
    background:#E9E6E0;box-shadow:0 4px 10px rgba(28,27,24,.14)}
  .cico img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
  .cico .cem{position:relative;z-index:2;line-height:1}
  .cico.hasimg .cem{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:rgba(14,124,102,.32);text-shadow:0 1px 5px rgba(0,0,0,.55)}
  .cat.on .cico{box-shadow:0 0 0 3px var(--brand-soft),0 4px 10px rgba(14,124,102,.22);border-color:var(--brand)}
  .cat span{font-size:10px;color:var(--ink-2);text-align:center;line-height:1.18;width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .cat.on span{color:var(--brand)}

  /* ═══ event card ═══ */
  .ecard{margin:0 20px 12px;background:#fff;border:1px solid rgba(28,27,24,.07);border-radius:16px;padding:10px;
    display:flex;gap:12px;cursor:pointer;position:relative;box-shadow:0 2px 10px rgba(28,27,24,.05)}
  .ec-thumb{width:84px;height:84px;border-radius:14px;flex:none;position:relative;overflow:hidden;
    background:#E9E6E0;box-shadow:0 2px 8px rgba(28,27,24,.10)}
  .ec-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ec-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .ec-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .ec-cat{font-size:10px;font-weight:800;color:var(--brand);letter-spacing:.4px;text-transform:uppercase}
  .ec-reason{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--gold-soft);color:#8A6A22}
  .ec-reason.near{background:var(--brand-soft);color:var(--brand)}
  .ec-title{font-size:13.5px;font-weight:700;line-height:1.32;margin-bottom:5px;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ec-meta{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px;margin-bottom:2px}
  .ec-bot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:5px}
  .ec-price{font-size:13px;font-weight:800;color:var(--brand)}
  .ec-price.free{color:var(--gold)}
  .ec-org{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .ec-fav{position:absolute;top:10px;right:10px;font-size:15px;color:#C9C6BF;cursor:pointer;z-index:2}
  .ec-fav.on{color:var(--danger)}
  .ec-soc{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:7px;margin-top:3px}
  .ec-left{font-size:10px;font-weight:800;color:var(--danger);background:#FDECEA;border-radius:999px;padding:1.5px 6px}

  /* ═══ 行式列表（首页推荐 / Nearby）═══ */
  #eventList{margin:2px 20px 0;background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 1px 8px rgba(28,27,24,.06)}
  .evrow{display:flex;gap:12px;align-items:center;padding:11px 13px;cursor:pointer;position:relative;
    border-bottom:1px solid #F1EFEA;background:#fff}
  .evrow:last-child{border-bottom:none}
  .evrow:active{background:#F8F6F2}
  .rw-img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;
    box-shadow:0 2px 8px rgba(28,27,24,.10);background:#E9E6E0}
  .rw-body{flex:1;min-width:0}
  .rw-t{font-size:13.5px;font-weight:700;line-height:1.28;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;padding-right:24px}
  .rw-m{font-size:11px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .rw-b{display:flex;align-items:center;gap:7px;margin-top:5px;min-width:0}
  .rw-cat{font-size:9.5px;font-weight:800;color:var(--brand);letter-spacing:.4px;text-transform:uppercase;flex:none}
  .rw-tag{font-size:9.5px;font-weight:700;padding:1.5px 7px;border-radius:999px;background:var(--gold-soft);
    color:#8A6A22;flex:none}
  .rw-tag.near{background:var(--brand-soft);color:var(--brand)}
  .rw-soc{font-size:10.5px;color:var(--ink-3);flex:none}
  .rw-left{font-size:9.5px;font-weight:800;color:var(--danger);flex:none}
  .rw-price{margin-left:auto;font-size:12px;font-weight:800;color:var(--ink);flex:none;
    white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
  .rw-price.free{color:var(--gold)}
  .rw-fav{position:absolute;top:8px;right:11px;font-size:14px;color:#C9C6BF;cursor:pointer;z-index:2}
  .rw-fav.on{color:var(--danger)}

  /* ═══ empty ═══ */
  .empty{margin:0 20px;background:#fff;border:1px dashed #DCD9D2;border-radius:14px;padding:22px 18px;text-align:center}
  #eventList .empty{margin:0;border:1px dashed #DCD9D2;border-radius:0;box-shadow:none}
  .empty b{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
  .empty p{font-size:11.5px;color:var(--ink-3);line-height:1.55}

  /* ═══ tabbar ═══ */
  .tabbar{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:none;background:none;color:var(--ink-3);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .tab svg{width:22px;height:22px}
  .tab.active{color:var(--brand)}

  /* ═══ 浮动创建按钮 (FAB) ═══ */
  .fab{position:absolute;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));
    width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;z-index:80;cursor:pointer;
    box-shadow:0 7px 20px rgba(14,124,102,.44),0 2px 6px rgba(14,124,102,.28);
    transition:transform .16s ease,opacity .18s ease}
  .fab svg{width:26px;height:26px}
  .fab:active{transform:scale(.92)}
  .fab.hidden{opacity:0;pointer-events:none;transform:scale(.6)}
  .fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(14,124,102,.18)}

  /* ═══ sheet ═══ */
  .mask{position:absolute;inset:0;background:rgba(20,19,17,.42);opacity:0;pointer-events:none;
    transition:opacity .22s;z-index:100}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:101;
    transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);padding:8px 20px 22px;
    max-height:76%;overflow-y:auto;scrollbar-width:none}
  .sheet::-webkit-scrollbar{display:none}
  .sheet.on{transform:none}
  .grab{width:38px;height:4px;border-radius:2px;background:#DCD9D2;margin:0 auto 14px}
  .sheet h4{font-size:16px;font-weight:700;margin-bottom:4px}
  .sheet .sh-sub{font-size:11.5px;color:var(--ink-3);margin-bottom:15px;line-height:1.45}
  .sopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
    border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;font-family:inherit}
  .sopt.on{border-color:var(--brand);background:#F0F8F5}
  .sopt-t{flex:1;min-width:0}
  .sopt-t b{font-size:13.5px;font-weight:700;display:block}
  .sopt-t span{font-size:11.5px;color:var(--ink-2);margin-top:3px;display:block;line-height:1.4}
  .sopt-em{font-size:19px;flex:none}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid #C9C6BF;flex:none;position:relative}
  .sopt.on .radio{border-color:var(--brand);background:var(--brand)}
  .sopt.on .radio::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:#fff}
  .sopt.back{border:none;background:none;padding:8px 0;margin-bottom:10px;color:var(--brand);
    font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}

  /* ═══ detail ═══ */
  .dhero{height:224px;position:relative;display:flex;align-items:flex-end;padding:16px 18px;color:#fff;
    flex:none;background:#1C1B18;overflow:hidden}
  .dhero .dh-img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .dhero .dh-scr{position:absolute;left:0;top:0;right:0;bottom:0;z-index:1;
    background:linear-gradient(180deg,rgba(12,12,10,.44) 0%,rgba(12,12,10,.06) 36%,rgba(12,12,10,.84) 100%)}
  .dhero .dh-em{display:none}
  .dhero .dh-top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;
    justify-content:space-between;z-index:3}
  .dh-round{width:36px;height:36px;border-radius:50%;background:rgba(20,19,17,.34);color:#fff;display:flex;
    align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-family:inherit;border:none;
    backdrop-filter:blur(6px)}
  .dh-round.on{background:#fff;color:var(--danger)}
  .dh-top-r{display:flex;gap:8px}
  .dhero .dh-cat{font-size:10.5px;font-weight:800;letter-spacing:.5px;background:rgba(255,255,255,.92);
    color:var(--brand);border-radius:6px;padding:4px 9px;position:relative;z-index:2;text-transform:uppercase}
  .dbody{padding:16px 20px 0}
  .dtitle{font-size:20px;font-weight:800;line-height:1.22;letter-spacing:-.3px;margin-bottom:10px}
  .dorg{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .dorg .do-av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);display:flex;
    align-items:center;justify-content:center;font-size:19px;flex:none}
  .dorg .do-n{font-size:13px;font-weight:700}
  .dorg .do-s{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .kv{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F1EFEA;font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k-ic{width:20px;text-align:center;color:var(--brand);font-size:14px;flex:none}
  .kv .k-l{font-size:11px;color:var(--ink-3)}
  .kv .k-v{font-size:13px;font-weight:600}
  .kv .k-main{flex:1;min-width:0}
  .dsec{font-size:15px;font-weight:700;margin:18px 0 9px}
  .dabout{font-size:13px;color:var(--ink-2);line-height:1.62}
  .tier{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    border:1px solid var(--line);border-radius:14px;margin-bottom:9px;background:#fff}
  .tier-n{font-size:13.5px;font-weight:700}
  .tier-s{font-size:11px;color:var(--ink-3);margin-top:2px}
  .tier-p{font-size:13.5px;font-weight:800;color:var(--brand)}
  .cta{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px 18px;background:#fff;
    border-top:1px solid var(--line)}
  .cta-price{font-size:11px;color:var(--ink-3);line-height:1.2}
  .cta-price b{display:block;font-size:19px;color:var(--brand);font-weight:800}
  .btn{flex:1;min-height:48px;background:var(--brand);color:#fff;border:none;border-radius:14px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:active{background:var(--brand-dark)}
  .btn.danger{background:var(--danger)}
  .btn:disabled{opacity:.45}

  /* ═══ my tabs ═══ */
  .mtabs{display:flex;gap:8px;overflow-x:auto;padding:0 20px 10px;scrollbar-width:none;flex:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mtab{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-2);
    cursor:pointer;font-family:inherit;white-space:nowrap}
  .mtab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .mtab .cnt{font-size:10px;font-weight:800;background:var(--brand-soft);color:var(--brand);
    border-radius:999px;padding:1px 6px}
  .mtab.on .cnt{background:rgba(255,255,255,.26);color:#fff}

  /* ═══ form ═══ */
  .form{padding:0 20px}
  .fs{margin-bottom:18px}
  .fs-t{font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:9px;display:flex;align-items:center;gap:6px;
    letter-spacing:.2px}
  .fld{margin-bottom:11px}
  .fld label{font-size:11px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:6px}
  .fld input,.fld textarea,.fld select{width:100%;border:1.5px solid var(--line);border-radius:12px;
    padding:11px 12px;font-size:13px;color:var(--ink);background:#fff;outline:none;font-family:inherit}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--brand)}
  .fld textarea{min-height:74px;resize:none}
  .frow{display:flex;gap:10px}
  .frow .fld{flex:1}
  .te{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
  .te-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .te-n{font-size:13px;font-weight:700}
  .te-d{font-size:11.5px;color:var(--danger);font-weight:700;cursor:pointer}
  .addtier{width:100%;min-height:44px;border:1.5px dashed var(--brand);background:var(--brand-soft);
    color:var(--brand);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .covpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .covpick .cov{aspect-ratio:1;border:2px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;
    padding:0;position:relative}
  .covpick .cov img{width:100%;height:100%;object-fit:cover;display:block}
    font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0}
  .covpick .cov.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .covpick .cov.on::after{content:"✓";position:absolute;right:3px;bottom:1px;width:16px;height:16px;
    border-radius:50%;background:var(--brand);color:#fff;font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .note{font-size:11.5px;color:var(--ink-3);line-height:1.55;background:#FAF9F6;border:1px solid var(--line);
    border-radius:11px;padding:10px 12px}
  .summ{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:16px}
  .summ-r{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EFEA;font-size:12px}
  .summ-r:last-child{border-bottom:none}
  .summ-r span{color:var(--ink-3)}
  .summ-r b{font-weight:700}

  /* ═══ checkout ═══ */
  .qty{display:flex;align-items:center;gap:11px}
  .qb{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
    font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-family:inherit}
  .qb:disabled{opacity:.3}
  .qv{font-size:13.5px;font-weight:800;min-width:20px;text-align:center}

  /* ═══ 订单（30 分钟有效期）═══ */
  .cdbanner{margin:0 20px 14px;background:var(--gold-soft);border:1px solid #EADFC2;border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:11px}
  .cdbanner .cd-ic{font-size:19px;flex:none}
  .cdbanner .cd-txt{flex:1;font-size:11.5px;color:#8A6A22;line-height:1.45;font-weight:600}
  .cdbanner .cd-time{font-size:17px;font-weight:800;color:#8A6A22;font-variant-numeric:tabular-nums;
    letter-spacing:.5px;flex:none}
  .cdbanner.expired{background:#F4F1EC;border-color:var(--line)}
  .cdbanner.expired .cd-txt{color:var(--ink-3)}
  .cdbanner.expired .cd-ic{filter:grayscale(1);opacity:.55}

  .payopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
    border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;
    font-family:inherit}
  .payopt.on{border-color:var(--brand);background:#F0F8F5}
  .payopt .po-ic{width:38px;height:38px;border-radius:11px;background:#FAF9F6;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .payopt.on .po-ic{background:var(--brand-soft);border-color:transparent}
  .po-t{flex:1;min-width:0}
  .po-t b{font-size:13.5px;font-weight:700;display:block}
  .po-t span{font-size:11px;color:var(--ink-3);margin-top:2px;display:block}
  .po-badge{font-size:10px;font-weight:800;color:var(--brand);background:var(--brand-soft);
    border-radius:999px;padding:3px 8px;flex:none}

  /* ═══ 电子票 ═══ */
  .okhero{margin:0 20px 16px;background:var(--brand-soft);border:1px solid #CFE7E0;border-radius:16px;
    padding:14px;display:flex;gap:12px;align-items:center}
  .okhero .ok-ic{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:19px;flex:none}
  .okhero .ok-t{font-size:15px;font-weight:800;color:var(--brand-dark)}
  .okhero .ok-s{font-size:11.5px;color:#4E7A6E;margin-top:2px}
  .okhero.used{background:#F4F1EC;border-color:var(--line)}
  .okhero.used .ok-ic{background:var(--ink-3)}
  .okhero.used .ok-t{color:var(--ink-2)}

  .tkt{margin:0 20px 14px;background:#fff;border-radius:18px;border:1px solid var(--line);overflow:hidden;
    box-shadow:0 4px 16px rgba(28,27,24,.08);position:relative}
  .tkt-top{padding:16px 16px 15px}
  .tkt-name{font-size:16.5px;font-weight:800;line-height:1.28;letter-spacing:-.2px}
  .tkt-sub{font-size:12px;color:var(--ink-2);margin-top:7px;line-height:1.55}
  .tkt-tiers{font-size:11.5px;color:var(--ink-2);background:#FAF9F6;border-radius:9px;padding:8px 11px;
    margin-top:11px;line-height:1.6}
  .tkt-perf{position:relative;border-top:2px dashed #E2DFD8}
  .tkt-perf::before,.tkt-perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;
    border-radius:50%;background:var(--bg);border:1px solid var(--line)}
  .tkt-perf::before{left:-12px}
  .tkt-perf::after{right:-12px}
  .qrwrap{padding:18px 16px 16px;text-align:center}
  .qrbox{width:214px;height:214px;margin:0 auto;padding:13px;border:1px solid var(--line);
    border-radius:16px;background:#fff}
  .qrbox svg{width:100%;height:100%;display:block}
  .qrwrap.dim .qrbox{opacity:.22;filter:grayscale(1)}
  .qr-cap{font-size:11px;color:var(--ink-3);margin-top:10px;font-weight:600;line-height:1.5}
  .tkt-code{font-size:14.5px;font-weight:800;letter-spacing:2px;margin-top:8px;color:var(--ink)}
  .tkt-bot{padding:13px 16px 16px;background:#FAF9F6}
  .tkrow{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:4.5px 0;color:var(--ink-3)}
  .tkrow b{color:var(--ink-2);font-weight:700;text-align:right;word-break:break-all}

  .chip{font-size:10px;font-weight:800;border-radius:999px;padding:3px 9px;flex:none;letter-spacing:.2px}
  .chip.pend{background:var(--gold-soft);color:#8A6A22}
  .chip.ok{background:var(--brand-soft);color:var(--brand)}
  .chip.used{background:#EEECE7;color:var(--ink-2)}
  .chip.expired{background:#F4F1EC;color:var(--ink-3)}
  .chip.refund{background:#FDECEA;color:var(--danger)}

  /* ═══ My Events 票券入口卡 ═══ */
  .tkentry{margin:2px 20px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;
    box-shadow:0 1px 8px rgba(28,27,24,.06)}
  .tkentry:active{background:#F8F6F2}
  .tke-ic{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);display:flex;
    align-items:center;justify-content:center;font-size:18px;flex:none}
  .tke-main{flex:1;min-width:0}
  .tke-main b{font-size:13.5px;font-weight:800;display:block}
  .tke-main span{font-size:11px;color:var(--ink-3);margin-top:2px;display:block}
  .tke-arrow{font-size:20px;color:var(--ink-3);flex:none;line-height:1}
  .tke-count{font-size:10.5px;font-weight:800;color:var(--brand);background:var(--brand-soft);
    border-radius:999px;padding:2px 8px;flex:none}

  .orow-actions{display:flex;gap:10px;padding:0 20px 20px}
  .orow-actions .btn{flex:1}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}

  /* ═══ toast ═══ */
  .toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,16px);background:rgba(20,19,17,.92);
    color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:all .24s;z-index:200;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ═══ 封面渐变 ═══ */
  .g-quran{background:linear-gradient(135deg,#065A4E,#0E7C66)}
  .g-tafsir{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
  .g-hadith{background:linear-gradient(135deg,#B45309,#D97706)}
  .g-fiqh{background:linear-gradient(135deg,#1E293B,#475569)}
  .g-aqeedah{background:linear-gradient(135deg,#7C3AED,#EC4899)}
  .g-halaqah{background:linear-gradient(135deg,#10B981,#0D9488)}
  .g-studycircle{background:linear-gradient(135deg,#0EA5E9,#14B8A6)}
  .g-arabic{background:linear-gradient(135deg,#F472B6,#FB923C)}
  .g-others{background:linear-gradient(135deg,#64748B,#9CA3AF)}
</style>
</head>

      </div>
      <div class="scroll">
        <div class="form" id="createForm"></div>
      </div>

    <div class="page" id="pg-checkout">
      <div class="navbar">
        <button class="back-btn" onclick="goBack()">‹</button>

        <div class="form" id="checkoutForm"></div>

      </div>
      <div class="cta" id="orderCta"></div>

</div>

/* 每页对应的渲染函数，跳转时自动调用，避免目标页空白 */
function renderPage(id){
  if(id==='pg-home'){renderLoc();renderCats();renderFeatured();renderList()}
  else if(id==='pg-my')renderMy();
  else if(id==='pg-create')renderCreate();
  else if(id==='pg-detail'&&detailId)renderDetail();
  else if(id==='pg-checkout'&&coId)renderCheckout();
  else if(id==='pg-manage'&&manageId)renderManage();
  else if(id==='pg-order'&&orderId)renderOrder();
  else if(id==='pg-ticket'&&ticketOrderId)renderTicket();
  else if(id==='pg-tickets')renderTk();
}

/* ══════════════════════════════════════════════
   页面跳转（对齐 Football 的 go/goBack）
══════════════════════════════════════════════ */
function go(id,back){
  var next=document.getElementById(id);if(!next)return;
  if(!back&&id!==CUR){
    if(TABS.indexOf(id)>=0)NAV=[];else NAV.push(CUR);
  }
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active','back-anim')});
  if(back)next.classList.add('back-anim');
  next.classList.add('active');
  var sc=next.querySelector('.scroll');if(sc)sc.scrollTop=0;
  var showTab=SHOWTAB.indexOf(id)>=0;
  document.getElementById('tabbar').style.display=showTab?'':'none';
  var fab=document.getElementById('fab');if(fab)fab.classList.toggle('hidden',!showTab);
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-pg')===id)});
  CUR=id;closeSheet();applyLang();renderPage(id);
}
function goBack(){
  if(!NAV.length){if(SHOWTAB.indexOf(CUR)>=0)return;go('pg-home',true);return}
  go(NAV.pop(),true);
}
function toast(cn,en){var t=document.getElementById('toast');t.textContent=T(cn,en);
  t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},1900)}

/* ══════════════════════════════════════════════
   首页渲染
══════════════════════════════════════════════ */
/* 位置即上下文：选了国家→按国家过滤；选了城市→同城 + 线上。
   localRank 仅决定排序（同城最前 → 线上 → 其他） */
function localRank(e){
  if(e.city===ST.city)return 0;
  if(e.type==='online'||e.city==='global')return 1;
  return 2;
}
function filtered(){
  var l=store.list();
  if(ST.cat!=='all')l=l.filter(function(e){return e.cat===ST.cat});
  if(ST.ctry)l=l.filter(function(e){return e.ctry===ST.ctry||e.type==='online'||e.city==='global'});
  else if(ST.city)l=l.filter(function(e){return e.city===ST.city||e.city==='global'||e.type==='online'});
  if(ST.q){var q=ST.q.toLowerCase();l=l.filter(function(e){return (e.name+' '+e.org+' '+e.loc).toLowerCase().indexOf(q)>=0})}
  return l;
}

function renderFeatured(){
  var l=filtered().filter(function(e){return e.feat});
  var rail=document.getElementById('featuredRail');
  if(!l.length){rail.innerHTML='<div class="empty" style="flex:0 0 350px"><b>'+T('暂无精选','No featured events')+'</b></div>';
    document.getElementById('featCount').textContent='';return}
  rail.innerHTML=l.map(function(e){
    return '<div class="bn" onclick="openDetail(\''+e.id+'\')">'+
      '<img class="bn-img" src="'+coverOf(e)+'" alt="" loading="lazy">'+
      '<div class="bn-scr"></div>'+
      '<div class="bn-tag">'+catOf(e.cat)+'</div>'+
      '<div class="bn-t">'+esc(e.name)+'</div>'+
      '<div class="bn-s">📅 '+fDate(e.start)+' · '+(e.loc?esc(e.loc):T('线上','Online'))+'</div>'+
      '<div class="bn-s bn-org">'+e.av+' '+esc(e.org)+'</div>'+
      '<div class="bn-f">'+priceOf(e)+'</div>'+
    '</div>';
  }).join('');
  document.getElementById('featCount').textContent=l.length+' '+T('个','');
}

function renderCats(){
  var rail=document.getElementById('catRail');
  var items=[{id:'all',label:T('全部','All'),em:'✨',g:'g-community',img:''}].concat(CATS.map(function(c){
    return{id:c.id,label:(LANG==='cn'?c.zh:c.en),em:c.em,g:gClass(c.id),img:catCover(c.id)}}));
  rail.innerHTML=items.map(function(c){
    return '<div class="cat '+(ST.cat===c.id?'on':'')+'" onclick="setCat(\''+c.id+'\')">'+
      '<div class="cico '+c.g+(c.img?' hasimg':'')+'">'+(c.img?'<img src="'+c.img+'" alt="">':'')+
      '<span class="cem">'+c.em+'</span></div><span>'+c.label+'</span></div>';
  }).join('');
}

function ecardHTML(e){
  var r=reasonOf(e),fav=ustore.isFav(e.id);
  var loc=e.type==='online'?T('线上','Online'):(e.loc||cityOf(e.city));
  return '<div class="evrow" onclick="openDetail(\''+e.id+'\')">'+
    '<img class="rw-img" src="'+coverOf(e)+'" alt="" loading="lazy">'+
    '<div class="rw-body">'+
      '<div class="rw-t">'+esc(e.name)+'</div>'+
      '<div class="rw-m">📅 '+fDate(e.start)+' · '+fTime(e.start)+' · 📍 '+esc(loc)+'</div>'+
      '<div class="rw-b"><span class="rw-cat">'+catOf(e.cat)+'</span>'+
      '<span class="rw-tag '+r.c+'">'+r.t+'</span>'+
      '<span class="rw-soc">👥 '+kfmt(goingOf(e))+'</span>'+
      '<b class="rw-price '+(priceFree(e)?'free':'')+'">'+priceOf(e)+'</b></div>'+
    '</div>'+
    '<div class="rw-fav '+(fav?'on':'')+'" onclick="event.stopPropagation();quickFav(\''+e.id+'\')">'+(fav?'♥':'♡')+'</div>'+
  '</div>';
}

function renderList(){
  var l=filtered();
  /* Near By：严格线下。选了国家→该国线下；选了城市→同城线下；全部→所有线下 */
  var list=(ST.tab==='nearby')?l.filter(function(e){
    return e.type==='offline'&&(ST.ctry?e.ctry===ST.ctry:(ST.city?e.city===ST.city:true));
  }):l.filter(function(e){return !e.feat});
  if(ST.tab==='forYou')list=list.slice().sort(function(a,b){return localRank(a)-localRank(b)});
  var el=document.getElementById('eventList');
  el.innerHTML=list.length?list.map(ecardHTML).join(''):
    '<div class="empty"><b>'+T('该地区暂无活动','No events here yet')+'</b><p>'+
    (ST.q?T('换个筛选条件试试','Try changing your filters')
          :T('换个城市或分类试试，或去线上活动看看','Try another city or category — or browse online events'))+'</p></div>';
}

function setTab(t){ST.tab=t;
  document.getElementById('segForYou').classList.toggle('on',t==='forYou');
  document.getElementById('segNear').classList.toggle('on',t==='nearby');
  renderList()}
function setCat(c){ST.cat=c;renderCats();renderFeatured();renderList()}
function onSearch(v){ST.q=v;renderFeatured();renderList()}
function quickFav(id){var a=ustore.togFav(id);toast('已收藏','Saved','removed');renderList()}

function renderLoc(){
  var c=CITIES.filter(function(x){return x.id===ST.city})[0];
  var city=ST.ctry?ctryOf(ST.ctry):(c?(LANG==='cn'?c.zh:c.en):T('全部','All'));
  var fl=(ST.ctry?ctryFl(ST.ctry):(c?ctryFl(c.c):'🌍'));
  document.getElementById('locCity').innerHTML=esc(city)+' <span>'+fl+'</span>';
  document.getElementById('locSub').textContent=
    ST.ctry?(T('正在展示','Showing ')+ctryOf(ST.ctry)+T('的活动',' events'))
    :(ST.city?T('正在展示','Showing ')+city+T('的活动',' events')
    :T('正在展示全球活动','Showing events worldwide'));
  document.getElementById('locAct').textContent=T('更换','Change');
}

/* ══════════════════════════════════════════════
   位置选择：两级 sheet（国家 → 城市）
══════════════════════════════════════════════ */
var sheetLevel='country',sheetCtry='';
function openLocSheet(){sheetLevel='country';renderLocSheet();openSheet()}
function renderLocSheet(){
  var sh=document.getElementById('sheet'),h='';
  if(sheetLevel==='country'){
    h='<div class="grab"></div><h4>'+T('选择国家','Select country')+'</h4>'+
      '<div class="sh-sub">'+T('先选国家，再选城市','Pick a country, then a city')+'</div>'+
      '<button class="sopt '+(ST.ctry===''&&ST.city===''?'on':'')+'" onclick="pickAll()">'+
        '<span class="sopt-em">🌍</span><div class="sopt-t"><b>'+T('全部国家','All countries')+'</b>'+
        '<span>'+T('不限国家，看全部活动','Show events from everywhere')+'</span></div><div class="radio"></div></button>';
    COUNTRIES.forEach(function(c){
      h+='<button class="sopt '+(ST.ctry===c.id?'on':'')+'" onclick="pickCtry(\''+c.id+'\')">'+
        '<span class="sopt-em">'+c.fl+'</span><div class="sopt-t"><b>'+(LANG==='cn'?c.zh:c.en)+'</b>'+
        '<span>'+CITIES.filter(function(x){return x.c===c.id}).length+' '+T('个城市','cities')+'</span></div>'+
        '<div class="radio"></div></button>';
    });
  }else{
    var c=COUNTRIES.filter(function(x){return x.id===sheetCtry})[0];
    h='<div class="grab"></div>'+
      '<button class="sopt back" onclick="sheetLevel=\'country\';renderLocSheet()">‹ '+T('返回国家','Back to countries')+'</button>'+
      '<h4>'+T('选择城市','Select city')+'</h4>'+
      '<div class="sh-sub">'+c.fl+' '+(LANG==='cn'?c.zh:c.en)+'</div>'+
      '<button class="sopt '+(ST.ctry===sheetCtry&&ST.city===''?'on':'')+'" onclick="pickCtryAll()">'+
        '<span class="sopt-em">🏙️</span><div class="sopt-t"><b>'+T('全国','All cities')+'</b>'+
        '<span>'+T('该国全部城市','Every city in this country')+'</span></div><div class="radio"></div></button>';
    CITIES.filter(function(x){return x.c===sheetCtry}).forEach(function(ct){
      h+='<button class="sopt '+(ST.city===ct.id?'on':'')+'" onclick="pickCity(\''+ct.id+'\')">'+
        '<span class="sopt-em">📍</span><div class="sopt-t"><b>'+(LANG==='cn'?ct.zh:ct.en)+'</b></div>'+
        '<div class="radio"></div></button>';
    });
  }
  sh.innerHTML=h;
}
function pickCtry(id){sheetCtry=id;sheetLevel='city';renderLocSheet()}
function pickCity(id){ST.city=id;ST.ctry='';ST.picked=true;renderLoc();closeSheet();renderFeatured();renderList();
  toast('已切换城市','Location updated')}
function pickCtryAll(){ST.ctry=sheetCtry;ST.city='';ST.picked=true;renderLoc();closeSheet();renderFeatured();renderList();
  toast('已切换国家','Country updated')}
function pickAll(){ST.ctry='';ST.city='';ST.picked=true;renderLoc();closeSheet();renderFeatured();renderList();
  toast('已显示全部','Showing all')}
function openSheet(){document.getElementById('mask').classList.add('on');document.getElementById('sheet').classList.add('on')}
function closeSheet(){document.getElementById('mask').classList.remove('on');document.getElementById('sheet').classList.remove('on')}

function openDetail(id){detailId=id;ustore.view(id);renderDetail();go('pg-detail')}
function renderDetail(){
  var e=store.get(detailId);if(!e)return;
  var hero=document.getElementById('dhero');
  hero.className='dhero';
  var himg=document.getElementById('dheroImg');if(himg)himg.src=coverOf(e);
  document.getElementById('dheroCat').textContent=catOf(e.cat);
  var f=ustore.isFav(e.id),fb=document.getElementById('favBtn');
  fb.textContent=f?'♥':'♡';fb.className='dh-round'+(f?' on':'');

  var online=e.type==='online',loc=online?T('线上','Online'):(e.loc||cityOf(e.city));
  var dur=(e.dh?e.dh+T('小时','h')+' ':'')+(e.dm?e.dm+T('分','m'):'');
  var s0=sumT(e.tiers);
  var h='<div class="dtitle">'+esc(e.name)+'</div>'+
    '<div class="dorg"><div class="do-av">'+e.av+'</div><div><div class="do-n">'+esc(e.org)+'</div>'+
    '<div class="do-s">'+T('主办方','Organizer')+'</div></div></div>'+
    '<div class="card" style="padding:4px 14px">'+
      kv('📅',T('日期','Date'),fDate(e.start)+' · '+fTime(e.start))+
      kv('📍',T('地点','Location'),esc(loc))+
      kv('⏱️',T('时长','Duration'),dur)+
      (goingOf(e)?kv('👥',T('已报名','Going'),kfmt(goingOf(e))+' '+T('人已报名','people going')):'')+
      (priceFree(e)?kv('💰',T('门票','Entry'),T('免费入场','Free entry')):kv('💰',T('起售价','From'),moneyOf(e,s0.minPrice)))+
    '</div>'+
    '<div class="dsec">'+T('活动介绍','About')+'</div>'+
    '<div class="dabout">'+esc(e.desc)+'</div>'+
    '<div class="dsec">'+T('票种','Tickets')+'</div>'+
    e.tiers.map(function(t){
      return '<div class="tier"><div><div class="tier-n">'+esc(t.name)+'</div>'+
        '<div class="tier-s">'+t.stock+' '+T('剩余','left')+'</div></div>'+
        '<div class="tier-p">'+(t.price?moneyOf(e,t.price):T('免费','Free'))+'</div></div>';
    }).join('');
  document.getElementById('dbody').innerHTML=h;

  var s=sumT(e.tiers);
  /* 已有票券 / 有未支付订单 → CTA 直接进入对应流程 */
  var myTkt=OSTORE.list().filter(function(o){return o.ev===e.id&&(o.status==='paid'||o.status==='used')})[0];
  var myPend=OSTORE.list().filter(function(o){return o.ev===e.id&&o.status==='pending'})[0];
  document.getElementById('dcta').innerHTML=
    (myTkt?
      '<div class="cta-price">'+T('状态','Status')+'<b style="color:var(--brand)">'+(myTkt.status==='used'?T('已核销','Verified'):T('已购票','Paid'))+'</b></div>'+
      '<button class="btn" onclick="openTicket(\''+myTkt.id+'\')">'+T('查看电子票','View e-ticket')+'</button>'
    :myPend?
      '<div class="cta-price">'+T('待支付','Unpaid')+'<b>'+moneyOf(e,myPend.amt)+'</b></div>'+
      '<button class="btn" onclick="openOrder(\''+myPend.id+'\')">'+T('继续支付 · 剩','Continue payment · ')+mmss(myPend.expires-Date.now())+'</button>'
    :
      '<div class="cta-price">'+T('票价','Price')+'<b>'+(priceFree(e)?T('免费','Free'):moneyOf(e,s.minPrice))+'</b></div>'+
      '<button class="btn" onclick="doBook()">'+(priceFree(e)?T('免费报名','Register free'):T('购买门票','Buy tickets'))+'</button>');
}
function kv(ic,l,v){return '<div class="kv"><span class="k-ic">'+ic+'</span><div class="k-main">'+
  '<div class="k-l">'+l+'</div><div class="k-v">'+v+'</div></div></div>'}
function toggleFav(){var e=store.get(detailId);if(!e)return;
  var a=ustore.togFav(e.id);toast(a?'已收藏':'已取消收藏',a?'Saved':'Removed');renderDetail()}
function shareEvent(){var e=store.get(detailId);
  try{navigator.clipboard&&navigator.clipboard.writeText(location.href.split('?')[0]+'?e='+e.id)}catch(x){}
  toast('链接已复制','Link copied')}
function doBook(){var e=store.get(detailId);if(!e)return;
  if(priceFree(e)){ustore.book(e.id);toast('已预约','Booked');ST.myTab='booked';renderMy();go('pg-my');return}
  openCheckout(e.id)}

   My Events
══════════════════════════════════════════════ */
var MYT=[
  {id:'created',cn:'我创建的',en:'Created',em:'📝'},
  {id:'fav',cn:'收藏的',en:'Saved',em:'♥'},
  {id:'att',cn:'参与过的',en:'Attended',em:'✅'},
  {id:'his',cn:'浏览历史',en:'History',em:'🕘'},
  {id:'book',cn:'预约的',en:'Booked',em:'🔖'}
];
function myCount(id){
  var m=meta();
  if(id==='created')return store.list().filter(function(e){return e.org==='Ahmad Rahman'}).length;
  if(id==='fav')return m.fav.length;
  if(id==='att')return m.att.length;
  if(id==='his')return m.his.length;
  if(id==='book')return m.book.length;
  return 0;
}
function myList(id){
  var all=store.list(),m=meta(),ids;
  if(id==='created')return all.filter(function(e){return e.org==='Ahmad Rahman'});
  if(id==='fav')ids=m.fav;else if(id==='att')ids=m.att;else if(id==='his')ids=m.his;
  else if(id==='book')ids=m.book;else ids=m.paid;
  return ids.map(function(i){return all.filter(function(e){return e.id===i})[0]}).filter(Boolean);
}
var MYEMPTY={created:['还没有创建活动','Events you create appear here'],
  fav:['还没有收藏','Tap the heart on any event to save it'],
  att:['还没有参与记录','Events you attended appear here'],
  his:['还没有浏览记录','Events you browse appear here'],
  book:['还没有预约','Free events you register for appear here']};
function renderMy(){
  var tabs=document.getElementById('myTabs');
  tabs.innerHTML=MYT.map(function(t){
    return '<button class="mtab '+(ST.myTab===t.id?'on':'')+'" onclick="setMyTab(\''+t.id+'\')">'+
      t.em+' '+T(t.cn,t.en)+'<span class="cnt">'+myCount(t.id)+'</span></button>';
  }).join('');
  /* 票券入口卡（独立于 tab，点击进入 pg-tickets） */
  var os=OSTORE.list().filter(function(o){return o.status!=='expired'});
  var valid=os.filter(function(o){return o.status==='paid'}).length;
  document.getElementById('tkeSub').textContent=valid?
    T('二维码电子票 · 线下扫码入场','QR e-tickets · scan at the door'):
    T('购买后在这里查看电子票','Your tickets appear here after purchase');
  document.getElementById('tkeCount').textContent=valid?
    valid+' '+T('张有效','valid'):'—';

  var el=document.getElementById('myList');
  var l=myList(ST.myTab);
  if(!l.length){var em=MYEMPTY[ST.myTab];
    el.innerHTML='<div class="empty" style="margin-top:16px"><b>'+T(em[0],em[1])+'</b></div>';return}
  var isCreated=(ST.myTab==='created');
  el.innerHTML=l.map(function(e){
    return '<div class="ecard" onclick="'+(isCreated?'openManage(\''+e.id+'\')':'openDetail(\''+e.id+'\')')+'">'+
      '<div class="ec-thumb"><img src="'+coverOf(e)+'" alt="" loading="lazy"></div>'+
      '<div class="ec-body">'+
        '<div class="ec-top"><span class="ec-cat">'+catOf(e.cat)+'</span>'+
        (isCreated?'<span class="ec-reason">'+T('管理','Manage')+'</span>':'')+'</div>'+
        '<div class="ec-title">'+esc(e.name)+'</div>'+
        '<div class="ec-meta">📅 '+fDate(e.start)+' · '+fTime(e.start)+'</div>'+
        '<div class="ec-meta">📍 '+esc(e.type==='online'?T('线上','Online'):(e.loc||cityOf(e.city)))+'</div>'+
        '<div class="ec-bot"><span class="ec-price '+(priceFree(e)?'free':'')+'">'+priceOf(e)+'</span></div>'+
      '</div></div>';
  }).join('');
}
function setMyTab(id){ST.myTab=id;renderMy()}

/* ══════════════════════════════════════════════
   My Tickets（独立票券页）
══════════════════════════════════════════════ */
var TKSEG=[
  {id:'all',cn:'全部',en:'All',em:'🎟️'},
  {id:'pend',cn:'待支付',en:'To Pay',em:'⏳'},
  {id:'up',cn:'待使用',en:'Upcoming',em:'✅'},
  {id:'used',cn:'已核销',en:'Used',em:'📌'},
  {id:'ref',cn:'已退款',en:'Refunded',em:'↩️'}
];
function tkSegCount(seg){
  var a=OSTORE.list();
  if(seg==='all')return a.filter(function(o){return o.status!=='expired'}).length;
  if(seg==='pend')return a.filter(function(o){return o.status==='pending'}).length;
  if(seg==='up')return a.filter(function(o){return o.status==='paid'}).length;
  if(seg==='used')return a.filter(function(o){return o.status==='used'}).length;
  if(seg==='ref')return a.filter(function(o){return o.status==='refunded'}).length;
  return 0;
}
function renderTk(){
  var tabs=document.getElementById('tkTabs');
  tabs.innerHTML=TKSEG.map(function(t){
    return '<button class="mtab '+(ST.tkTab===t.id?'on':'')+'" onclick="setTkTab(\''+t.id+'\')">'+
      t.em+' '+T(t.cn,t.en)+'<span class="cnt">'+tkSegCount(t.id)+'</span></button>';
  }).join('');
  var os=OSTORE.list().filter(function(o){
    if(ST.tkTab==='all')return o.status!=='expired';
    if(ST.tkTab==='pend')return o.status==='pending';
    if(ST.tkTab==='up')return o.status==='paid';
    if(ST.tkTab==='used')return o.status==='used';
    if(ST.tkTab==='ref')return o.status==='refunded';
    return false;
  });
  var el=document.getElementById('tkList');
  if(!os.length){
    el.innerHTML='<div class="empty" style="margin:16px 20px 0"><b>'+T('暂无票券','No tickets here')+'</b><p>'+
      T('购票后电子票会出现在这里，可用于线下扫码入场','Tickets you buy appear here with a QR code for entry')+'</p></div>';return}
  el.innerHTML=os.map(function(o){
    var e=store.get(o.ev);if(!e)return '';
    var pend=o.status==='pending';
    return '<div class="ecard" onclick="'+(pend?
        "openOrder('"+o.id+"')":"openTicket('"+o.id+"')")+'">'+

function submitCreate(){
  if(!CF.name.trim()){toast('请填写活动名称','Please enter an event name');return}
  if(!CF.desc.trim()){toast('请填写活动介绍','Please add a description');return}
  if(CF.type==='offline'&&!CF.loc.trim()){toast('请填写场地地址','Please add a venue address');return}
  if(CF.type==='online'&&!CF.link.trim()){toast('请填写会议链接','Please add a meeting link');return}
  if(!CF.date||!CF.time){toast('请选择日期与时间','Please pick a date and time');return}
  if(CF.paid&&CF.tiers.some(function(t){return !t.name.trim()})){toast('请填写每种票的名称','Please name each ticket type');return}
  if(CF.paid&&CF.tiers.some(function(t){return t.stock<=0})){toast('库存需大于 0','Stock must be above 0');return}
  var r=store.create({name:CF.name.trim(),desc:CF.desc.trim(),type:CF.type,
    loc:CF.type==='offline'?CF.loc.trim():CF.link.trim(),
    start:CF.date+' '+CF.time,dh:CF.dh,dm:CF.dm,
    paid:CF.paid,tiers:CF.paid?CF.tiers:defTiers(),cat:CF.cat,ctry:CF.ctry,
    city:CF.type==='online'?'global':CF.city,org:CF.org.trim()||'Ahmad Rahman',av:CF.av,
    cap:CF.capMode==='limited'?CF.cap:0,vis:CF.vis,dis:CF.dis,img:CF.img});

  resetCF();
  ST.myTab='created';renderMy();go('pg-my');

var COSEL={},CODIS='';
function openCheckout(id){coId=id;var e=store.get(id);if(!e)return;
  COSEL={};e.tiers.forEach(function(t){COSEL[t.id]=0});CODIS='';renderCheckout();go('pg-checkout')}
function renderCheckout(){
  var e=store.get(coId);if(!e)return;
  document.getElementById('checkoutForm').innerHTML=
    '<div class="card" style="padding:14px;margin-bottom:14px">'+
      '<div style="font-size:15px;font-weight:800;line-height:1.3">'+esc(e.name)+'</div>'+
      '<div style="font-size:11.5px;color:var(--ink-3);margin-top:5px">📅 '+fDate(e.start)+' · '+fTime(e.start)+'</div>'+
    '</div>'+
    e.tiers.map(function(t){
      return '<div class="te"><div class="te-h"><span class="te-n">'+esc(t.name)+'</span></div>'+
        '<div style="display:flex;align-items:center;gap:11px">'+
        '<div style="flex:1"><div class="tier-p">'+moneyOf(e,t.price)+'</div>'+
        '<div class="tier-s">'+t.stock+' '+T('剩余','left')+'</div></div>'+
        '<div class="qty"><button class="qb" onclick="coDec(\''+t.id+'\')"'+(COSEL[t.id]<=0?' disabled':'')+'>−</button>'+
        '<span class="qv">'+COSEL[t.id]+'</span>'+
        '<button class="qb" onclick="coInc(\''+t.id+'\')">＋</button></div></div></div>';
    }).join('')+
    '<div class="fs" style="margin-top:14px"><div class="fld"><label>'+T('优惠码','Discount code')+'</label>'+
    '<input type="text" id="coDis" value="'+esc(CODIS)+'" placeholder="EARLY20" oninput="CODIS=this.value;renderCoTotal()"></div>'+
    '<div class="note">⏱️ '+T('提交订单后需在 30 分钟内完成支付，逾期订单自动取消。','Complete payment within 30 minutes after submitting, or the order expires automatically.')+'</div></div>';
  renderCoTotal();
}
function coInc(id){var e=store.get(coId),t=e.tiers.filter(function(x){return x.id===id})[0];
  if(COSEL[id]>=t.stock){toast('库存不足','Out of stock');return}COSEL[id]++;renderCheckout()}
function coDec(id){COSEL[id]=Math.max(0,COSEL[id]-1);renderCheckout()}
function renderCoTotal(){
  var e=store.get(coId);if(!e)return;
  var q=0,p=0;e.tiers.forEach(function(t){q+=COSEL[t.id];p+=COSEL[t.id]*t.price});
  var d=(CODIS.toUpperCase()==='EARLY20')?Math.round(p*0.2):0,f=p-d;
  document.getElementById('coTotal').innerHTML=
    '<div class="cta-price">'+T('共','Total')+' '+q+' '+T('张','tickets')+'<b>'+moneyOf(e,f)+'</b></div>'+
    '<button class="btn" onclick="coSubmit()"'+(q<=0?' disabled':'')+'>'+T('提交订单','Create order')+'</button>';
}
/* 提交订单 → 进入确认页（30 分钟支付窗口） */
function coSubmit(){
  var e=store.get(coId);if(!e)return;
  var q=0,p=0;e.tiers.forEach(function(t){q+=COSEL[t.id];p+=COSEL[t.id]*t.price});
  if(q<=0){toast('请先选择票数','Select tickets first');return}
  var d=(CODIS.toUpperCase()==='EARLY20')?Math.round(p*0.2):0;
  var o=OSTORE.create(e.id,COSEL,CODIS,p-d);
  orderId=o.id;renderOrder();go('pg-order');
  toast('订单已创建，请在 30 分钟内支付','Order created — pay within 30 min');
}

/* ══════════════════════════════════════════════
   确认订单（倒计时 30 分钟）
══════════════════════════════════════════════ */
var PAYMS=[
  {id:'token',ic:'🪙',cn:'Wahda Token',scn:'余额 1,280 WT',sen:'Balance 1,280 WT',en:'Wahda Token',rec:1},
  {id:'card',ic:'💳',cn:'Visa ·· 4242',scn:'信用卡 · 3D Secure',sen:'Credit card · 3D Secure',en:'Visa ·· 4242',rec:0},
  {id:'apple',ic:'🍎',cn:'Apple Pay',scn:'面容 ID 快捷支付',sen:'Pay with Face ID',en:'Apple Pay',rec:0}
];
function mmss(ms){ms=Math.max(0,ms);var m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function fdt(ts){var d=new Date(ts),p=function(x){return (x<10?'0':'')+x};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function orderQty(o){var n=0;for(var k in o.sel)n+=o.sel[k]||0;return n}

function renderOrder(){
  var o=OSTORE.get(orderId);if(!o)return;
  var e=store.get(o.ev);if(!e)return;
  var pend=o.status==='pending';
  var el=document.getElementById('orderForm');
  var lines=e.tiers.filter(function(t){return (o.sel[t.id]||0)>0}).map(function(t){
    return '<div class="summ-r"><span>'+esc(t.name)+' × '+o.sel[t.id]+'</span><b>'+moneyOf(e,t.price*o.sel[t.id])+'</b></div>';
  }).join('');
  var gross=0;e.tiers.forEach(function(t){gross+=(o.sel[t.id]||0)*t.price});
  var disc=(o.dis&&o.dis.toUpperCase()==='EARLY20')?Math.round(gross*0.2):0;

  el.innerHTML=
    (pend?
      '<div class="cdbanner" style="margin:0 0 14px"><span class="cd-ic">⏳</span>'+
      '<div class="cd-txt">'+T('请在 30 分钟内完成支付，逾期订单自动取消','Complete payment within 30 minutes or the order expires')+'</div>'+
      '<span class="cd-time" id="cdTime">'+mmss(o.expires-Date.now())+'</span></div>'
      :
      '<div class="cdbanner expired" style="margin:0 0 14px"><span class="cd-ic">⛔</span>'+
      '<div class="cd-txt">'+T('订单已失效 —— 未在 30 分钟内完成支付','Expired — payment was not completed in 30 minutes')+'</div></div>')+

    '<div class="card" style="padding:14px;margin-bottom:14px">'+
      '<div style="font-size:15px;font-weight:800;line-height:1.3">'+esc(e.name)+'</div>'+
      '<div style="font-size:11.5px;color:var(--ink-3);margin-top:5px">📅 '+fDate(e.start)+' · '+fTime(e.start)+
      ' · 📍 '+esc(e.type==='online'?T('线上','Online'):(e.loc||cityOf(e.city)))+'</div>'+
    '</div>'+

    '<div class="fs" style="margin-bottom:14px"><div class="fs-t">🧾 '+T('订单明细','Order details')+'</div>'+
      '<div class="summ">'+lines+
        (disc?'<div class="summ-r"><span>'+T('优惠 EARLY20','EARLY20 discount')+'</span><b style="color:var(--danger)">-'+moneyOf(e,disc)+'</b></div>':'')+
        '<div class="summ-r"><span>'+T('合计','Total')+' · '+orderQty(o)+' '+T('张','tickets')+'</span>'+
        '<b style="font-size:15px;color:var(--brand)">'+moneyOf(e,o.amt)+'</b></div>'+
        '<div class="summ-r"><span>'+T('订单编号','Order no.')+'</span><b>'+o.id+'</b></div>'+
        '<div class="summ-r"><span>'+T('下单时间','Placed at')+'</span><b>'+fdt(o.created)+'</b></div>'+
      '</div></div>'+

    (pend?'<div class="fs" style="margin-bottom:14px"><div class="fs-t">💳 '+T('支付方式','Payment method')+'</div>'+
      PAYMS.map(function(pm){
        return '<button class="payopt '+(PAYM===pm.id?'on':'')+'" onclick="PAYM=\''+pm.id+'\';renderOrder()">'+
          '<span class="po-ic">'+pm.ic+'</span>'+
          '<div class="po-t"><b>'+(LANG==='cn'?pm.cn:pm.en)+'</b><span>'+T(pm.scn,pm.sen)+'</span></div>'+
          (pm.rec?'<span class="po-badge">'+T('推荐','Best')+'</span>':'')+
        '</button>';
      }).join('')+
      '<div class="note">🔒 '+T('支付由 Wahda Pay 安全加密处理，支持 3D Secure 验证。','Payments are encrypted and processed securely by Wahda Pay.')+'</div>'+
    '</div>':'');
  renderOrderCta();
}
function renderOrderCta(){
  var o=OSTORE.get(orderId);if(!o)return;
  var e=store.get(o.ev);if(!e)return;
  var cta=document.getElementById('orderCta');
  if(o.status==='pending'){
    cta.innerHTML=
      '<div class="cta-price">'+T('需支付','Amount')+'<b>'+moneyOf(e,o.amt)+'</b></div>'+
      '<button class="btn" id="payBtn" onclick="payOrder()">'+T('立即支付','Pay now')+'</button>';
  }else{
    cta.innerHTML='';
    document.getElementById('orderForm').insertAdjacentHTML('beforeend',
      '<div class="orow-actions">'+
        '<button class="btn ghost" onclick="openDetail(\''+e.id+'\')">'+T('返回活动','Back to event')+'</button>'+
        '<button class="btn" onclick="openCheckout(\''+e.id+'\')">'+T('重新下单','Order again')+'</button>'+
      '</div>');
  }
}
/* 模拟支付：1.3s 处理 → 出票 */
function payOrder(){
  var o=OSTORE.get(orderId);if(!o||o.status!=='pending')return;
  var btn=document.getElementById('payBtn');
  if(btn){btn.disabled=true;btn.textContent=T('支付中…','Processing…')}
  setTimeout(function(){
    var o2=OSTORE.pay(orderId);
    if(!o2){renderOrder();toast('订单已失效','Order expired');return}
    var e=store.get(o2.ev);
    if(e){store.update(e.id,{going:(e.going||0)+orderQty(o2)})}
    ticketOrderId=orderId;
    toast('支付成功','Payment successful');
    renderTicket();go('pg-ticket');
  },1300);
}
function openOrder(id){orderId=id;renderOrder();go('pg-order')}

/* ══════════════════════════════════════════════
   电子票（二维码核销）
══════════════════════════════════════════════ */
function qrSVG(text){
  try{
    var qr=qrcode(0,'M');qr.addData(text);qr.make();
    var n=qr.getModuleCount(),p='',r,c;
    for(r=0;r<n;r++)for(c=0;c<n;c++)if(qr.isDark(r,c))
      p+='<path d="M'+c+' '+r+'h1v1h-1z"/>';
    return '<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" fill="#161513" xmlns="http://www.w3.org/2000/svg">'+p+'</svg>';
  }catch(x){return ''}
}
function paymName(id){var pm=PAYMS.filter(function(p){return p.id===id})[0];
  return pm?(LANG==='cn'?pm.cn:pm.en):'Wahda Pay'}
/* 退款资格：已支付未核销，且活动开始还有 24 小时以上 */
function evStart(e){var t=new Date((e.start||'').replace(' ','T')).getTime();return isNaN(t)?0:t}
function refundable(o,e){return o.status==='paid'&&evStart(e)-Date.now()>24*3600*1000}
function renderTicket(){
  var o=OSTORE.get(ticketOrderId);if(!o)return;
  var e=store.get(o.ev);if(!e)return;
  var used=o.status==='used',refunded=o.status==='refunded';
  var expired=o.status!=='paid'&&o.status!=='used'&&o.status!=='refunded';
  var canRef=refundable(o,e);
  var el=document.getElementById('ticketBody');
  var tierTxt=e.tiers.filter(function(t){return (o.sel[t.id]||0)>0}).map(function(t){
    return esc(t.name)+' × '+o.sel[t.id]}).join(' · ');
  var hero=used?
    '<div class="okhero used"><div class="ok-ic">✅</div><div><div class="ok-t">'+T('已核销','Ticket verified')+'</div>'+
    '<div class="ok-s">'+T('核销时间','Verified at')+' '+fdt(o.usedAt)+' · '+T('欢迎入场','Enjoy the event')+'</div></div></div>'
    :refunded?
    '<div class="okhero used"><div class="ok-ic">💸</div><div><div class="ok-t">'+T('退款已受理','Refund issued')+'</div>'+
    '<div class="ok-s">'+T('退款金额','Refunded')+' '+moneyOf(e,o.amt)+' · '+fdt(o.refundedAt)+' · '+T('原路退回 1–3 个工作日','Back to your payment method in 1–3 days')+'</div></div></div>'
    :'<div class="okhero"><div class="ok-ic">🎉</div><div><div class="ok-t">'+T('支付成功，出票完成','Paid — ticket issued')+'</div>'+
    '<div class="ok-s">'+T('实付','Paid')+' '+moneyOf(e,o.amt)+' · '+fdt(o.paidAt)+'</div></div></div>';

  /* 状态行 + 退款按钮区 */
  var acts='';
  if(o.status==='paid'){
    acts='<div class="orow-actions">'+
      '<button class="btn ghost" onclick="shareTicket()">↗ '+T('分享给朋友','Share')+'</button>'+
      '<button class="btn ghost" style="color:var(--danger);border-color:#F0D2D2"'+(canRef?'':' disabled')+
        ' onclick="askRefund()">↩ '+T('申请退款','Request refund')+'</button>'+
    '</div>'+
    '<div class="orow-actions" style="padding-top:0">'+
      '<button class="btn" onclick="demoScan()">📷 '+T('模拟主办方扫码核销','Simulate scan')+'</button>'+
    '</div>'+
    (canRef?'':'<div class="note" style="margin:0 20px 14px">⚠️ '+
      T('活动将于 24 小时内开始，已过退款时限（开始前 24 小时以上可退）。','This event starts within 24 hours — the refund window (24+ hours before start) is closed.')+'</div>');
  }

  el.innerHTML=hero+
    '<div class="tkt">'+
      '<div class="tkt-top">'+
        '<div class="tkt-name">'+esc(e.name)+'</div>'+
        '<div class="tkt-sub">📅 '+fDate(e.start)+' · '+fTime(e.start)+'<br>📍 '+
          esc(e.type==='online'?T('线上','Online'):(e.loc||cityOf(e.city)))+'</div>'+
        (tierTxt?'<div class="tkt-tiers">🎟️ '+tierTxt+'</div>':'')+
      '</div>'+
      '<div class="tkt-perf"></div>'+
      (expired?
        '<div class="qrwrap dim"><div class="qrbox"></div><div class="qr-cap">'+T('订单状态异常，无法出票','Invalid order status')+'</div></div>'
        :
        '<div class="qrwrap'+(used||refunded?' dim':'')+'">'+
        '<div class="qrbox">'+qrSVG('WAHDA|'+(o.ticket||rTicket())+'|'+o.id)+'</div>'+
        '<div class="qr-cap">'+(refunded?
            T('已退款，二维码已失效，不可入场','Refunded — this code is invalid')
          :used?T('二维码已核销，不可重复使用','This code has already been scanned')
          :T('入场时出示此二维码，工作人员扫码核销','Show this code at the entrance — staff will scan it'))+'</div>'+
        '<div class="tkt-code">'+(o.ticket||'—')+'</div>'+
        '</div>')+
      '<div class="tkt-bot">'+
        tkrow(T('订单编号','Order no.'),o.id)+
        tkrow(T('票号','Ticket no.'),o.ticket||'—')+
        tkrow(T('支付方式','Paid with'),paymName(o.paym))+
        tkrow(T('状态','Status'),tkStatus(o))+
      '</div>'+
    '</div>'+
    acts+
    '<div class="note" style="margin:0 20px 20px">📜 '+T('入场须知：电子票一人一码，扫码后立即失效；请于活动开始前 15 分钟到场；如需退款请在活动开始 24 小时前发起。','Notice: one ticket per code — it becomes invalid once scanned. Arrive 15 minutes early. Refunds must be requested at least 24 hours before the event starts.')+'</div>';
}
function tkrow(l,v){return '<div class="tkrow"><span>'+l+'</span><b>'+v+'</b></div>'}
function tkStatus(o){
  if(o.status==='paid')return '<span class="chip ok">'+T('已支付','Paid')+'</span>';
  if(o.status==='used')return '<span class="chip used">'+T('已核销','Used')+'</span>';
  if(o.status==='refunded')return '<span class="chip refund">'+T('已退款','Refunded')+'</span>';
  if(o.status==='expired')return '<span class="chip expired">'+T('已失效','Expired')+'</span>';
  return '<span class="chip pend">'+T('待支付','Unpaid')+'</span>';
}
function shareTicket(){try{navigator.clipboard&&navigator.clipboard.writeText(location.href.split('?')[0]+'?t='+(OSTORE.get(ticketOrderId)||{}).id)}catch(x){}
  toast('票券链接已复制','Ticket link copied')}
/* 核销演示：模拟主办方扫码 */
function demoScan(){
  var o=OSTORE.get(ticketOrderId);if(!o||o.status!=='paid')return;
  toast('扫码识别中…','Scanning…');
  setTimeout(function(){
    var r=OSTORE.use(ticketOrderId);
    if(r){renderTicket();toast('核销成功，欢迎入场','Verified — enjoy the event')}
    else{renderTicket();toast('核销失败：票据状态异常','Scan failed: invalid ticket')}
  },900);
}
function openTicket(id){ticketOrderId=id;renderTicket();go('pg-ticket')}

/* ══════════════════════════════════════════════
   退款（活动开始 24 小时前可退）
══════════════════════════════════════════════ */
function askRefund(){
  var o=OSTORE.get(ticketOrderId);if(!o||o.status!=='paid')return;
  var e=store.get(o.ev);if(!e)return;
  var sh=document.getElementById('sheet');
  sh.innerHTML='<div class="grab"></div>'+
    '<h4>'+T('申请退款','Request refund')+'</h4>'+
    '<div class="sh-sub">'+esc(e.name)+' · '+orderQty(o)+' '+T('张','tickets')+'</div>'+
    '<div class="summ" style="margin:0 0 14px">'+
      '<div class="summ-r"><span>'+T('退款金额','Refund amount')+'</span><b>'+moneyOf(e,o.amt)+'</b></div>'+
      '<div class="summ-r"><span>'+T('退回方式','Refund to')+'</span><b>'+paymName(o.paym)+'</b></div>'+
      '<div class="summ-r"><span>'+T('预计到账','Arrives')+'</span><b>'+T('1–3 个工作日','1–3 business days')+'</b></div>'+
    '</div>'+
    '<div class="note" style="margin:0 0 4px">⚠️ '+T('退款后电子票与二维码立即失效，不可再用于入场。','Your e-ticket and QR code become invalid immediately after the refund.')+'</div>'+
    '<div class="orow-actions" style="padding:14px 0 6px">'+
      '<button class="btn ghost" onclick="closeSheet()">'+T('取消','Cancel')+'</button>'+
      '<button class="btn danger" onclick="doRefund()">'+T('确认退款','Confirm refund')+'</button>'+
    '</div>';
  openSheet();
}
function doRefund(){
  var o=OSTORE.get(ticketOrderId);if(!o||o.status!=='paid')return;
  var e=store.get(o.ev);
  closeSheet();
  var r=OSTORE.refund(ticketOrderId);
  if(!r){renderTicket();return}
  if(e)store.update(e.id,{going:Math.max(0,(e.going||0)-orderQty(r))});
  toast('退款已受理','Refund requested');
  renderTicket();
  if(CUR==='pg-tickets')renderTk();
}

/* 订单时钟：每秒刷新倒计时 + 自动失效清扫 */
var ORD_EX_RR={};
setInterval(function(){
  var changed=OSTORE.sweep();
  if(changed){
    if(CUR==='pg-my')renderMy();
    if(CUR==='pg-tickets')renderTk();
    if(CUR==='pg-detail')renderDetail();
  }
  if(CUR==='pg-order'){
    var o=OSTORE.get(orderId);
    if(o&&o.status==='pending'){
      var el=document.getElementById('cdTime');
      if(el)el.textContent=mmss(o.expires-Date.now());
    }else if(o&&!ORD_EX_RR[o.id]){ORD_EX_RR[o.id]=1;renderOrder();
      toast('订单已失效','Order expired')}
  }
  if(CUR==='pg-tickets'){
    OSTORE.list().forEach(function(o){
      if(o.status!=='pending')return;
      var el2=document.getElementById('myCd'+o.id);
      if(el2)el2.textContent=mmss(o.expires-Date.now());
    });
  }
},1000);

/* ══════════════════════════════════════════════
   管理
══════════════════════════════════════════════ */
function openManage(id){manageId=id;renderManage();go('pg-manage')}
function renderManage(){
  var e=store.get(manageId);if(!e)return;
  document.getElementById('manageForm').innerHTML=
    '<div class="card" style="padding:14px;margin-bottom:14px">'+
      '<div style="font-size:15px;font-weight:800;line-height:1.3">'+esc(e.name)+'</div>'+
      '<div style="font-size:11.5px;color:var(--ink-3);margin-top:5px">📅 '+fDate(e.start)+' · '+T('票种','Tickets')+' '+e.tiers.length+'</div>'+
    '</div>'+
    '<div class="fs"><div class="fs-t">📊 '+T('库存管理','Stock')+'</div>'+
    e.tiers.map(function(t,i){
      return '<div class="te"><div class="te-h"><span class="te-n">'+esc(t.name)+'</span>'+
        '<span class="tier-s">'+T('剩余','left')+' '+t.stock+'</span></div>'+
        '<div class="fld"><label>'+T('库存','Stock')+'</label>'+
        '<input type="number" value="'+t.stock+'" min="0" oninput="store.get(\''+e.id+'\').tiers['+i+'].stock=Math.max(0,parseInt(this.value)||0)"></div></div>';
    }).join('')+
    '</div>'+
    '<button class="btn" style="width:100%;margin-bottom:12px" onclick="saveStock()">'+T('保存库存','Save stock')+'</button>'+
    '<button class="btn danger" style="width:100%;margin-bottom:20px" onclick="delEvent()">'+T('删除活动','Delete event')+'</button>';
}
function saveStock(){var e=store.get(manageId);store.update(manageId,{tiers:e.tiers});toast('库存已更新','Stock updated')}
function delEvent(){store.remove(manageId);toast('已删除','Deleted');ST.myTab='created';renderMy();go('pg-my')}

/* ══════════════════════════════════════════════
   渲染全部 + 初始化
══════════════════════════════════════════════ */
function renderAll(){
  renderLoc();renderCats();renderFeatured();renderList();renderMy();
  if(CUR==='pg-detail')renderDetail();
  if(CUR==='pg-create')renderCreate();
  if(CUR==='pg-checkout')renderCheckout();
  if(CUR==='pg-manage')renderManage();
  if(CUR==='pg-order')renderOrder();
  if(CUR==='pg-ticket')renderTicket();
  if(CUR==='pg-tickets')renderTk();
}
function init(){store.list();OSTORE.sweep();renderAll();applyLang()}
init();
</script>
</body>
